<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="640" height="390" fill="#ffffff"/>
  <g stroke="#222" stroke-width="1.5" fill="none">
    <!-- system boundary -->
    <rect x="240" y="20" width="370" height="325" fill="#fafafa"/>
    <!-- Employee -->
    <circle cx="90" cy="65" r="10" fill="#fff"/>
    <line x1="90" y1="75" x2="90" y2="100"/>
    <line x1="72" y1="84" x2="108" y2="84"/>
    <line x1="90" y1="100" x2="76" y2="120"/>
    <line x1="90" y1="100" x2="104" y2="120"/>
    <!-- Office Manager -->
    <circle cx="90" cy="225" r="10" fill="#fff"/>
    <line x1="90" y1="235" x2="90" y2="260"/>
    <line x1="72" y1="244" x2="108" y2="244"/>
    <line x1="90" y1="260" x2="76" y2="280"/>
    <line x1="90" y1="260" x2="104" y2="280"/>
    <!-- generalization: Office Manager -> Employee -->
    <line x1="90" y1="160" x2="90" y2="212"/>
    <polygon points="90,145 81,160 99,160" fill="#fff"/>
    <!-- associations -->
    <line x1="112" y1="84" x2="302" y2="72"/>
    <line x1="112" y1="88" x2="302" y2="144"/>
    <line x1="112" y1="244" x2="302" y2="212"/>
    <line x1="112" y1="248" x2="302" y2="282"/>
    <!-- use cases -->
    <ellipse cx="425" cy="72" rx="123" ry="28" fill="#ADD8E6"/>
    <ellipse cx="425" cy="144" rx="123" ry="28" fill="#ADD8E6"/>
    <ellipse cx="425" cy="212" rx="123" ry="28" fill="#ADD8E6"/>
    <ellipse cx="425" cy="282" rx="123" ry="28" fill="#ADD8E6"/>
  </g>
  <g fill="#222" text-anchor="middle">
    <text x="425" y="40" font-weight="bold" font-size="12" fill="#555">RoomBook</text>
    <text x="90" y="138">Employee</text>
    <text x="90" y="298">Office Manager</text>
    <text x="425" y="68" font-size="11" fill="#555">UC-001</text><text x="425" y="84">Book Room</text>
    <text x="425" y="140" font-size="11" fill="#555">UC-002</text><text x="425" y="156">Cancel Own Booking</text>
    <text x="425" y="208" font-size="11" fill="#555">UC-003</text><text x="425" y="224">Manage Rooms</text>
    <text x="425" y="278" font-size="11" fill="#555">UC-004</text><text x="425" y="294">Cancel Any Booking</text>
  </g>
  <rect x="480" y="358" width="14" height="14" fill="#ADD8E6" stroke="#222"/>
  <text x="500" y="370" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222">Status: Reviewed</text>
</svg>
